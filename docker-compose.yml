# Local PostgreSQL only. Usage: POSTGRES_PASSWORD=choose-one docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: twin
    ports: ["5432:5432"]
    volumes: ["twin_pgdata:/var/lib/postgresql/data"]
volumes:
  twin_pgdata:
