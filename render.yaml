# Render blueprint for the API + PostgreSQL (untested - see README). Any container host works the same way.
databases:
  - name: twin-db
    databaseName: twin
    user: twin
services:
  - type: web
    name: twin-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: twin-db, property: connectionString }
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false            # set to your Vercel URL, e.g. https://twin-xyz.vercel.app
      - key: ADMIN_API_KEY
        generateValue: true
      - key: AUTO_SEED
        value: "true"
